<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - الهجمات السيبرانية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="login-icon">🔐</span>
                <h1 class="login-title">الهجمات السيبرانية</h1>
                <p class="login-subtitle">موسوعة تفاعلية للهجمات الإلكترونية الكبرى</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="error-message" id="errorMessage"></div>
                <div class="lockout-message" id="lockoutMessage"></div>

                <div class="form-group">
                    <label for="username">👤 اسم المستخدم</label>
                    <span class="form-icon">👤</span>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">🔑 كلمة المرور</label>
                    <button type="button" class="password-toggle" id="togglePass" onclick="togglePassword()">👁️</button>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">🔐 تسجيل الدخول</button>

                <div class="attempts-counter" id="attemptsCounter">محاولات متبقية: 5</div>
            </form>

            <div class="security-badge">
                <span>🛡️</span>
                <span>نظام مصادقة آمن - المحاولات المسموحة: 5</span>
            </div>

            <div class="login-footer">
                <div class="author">👨‍💻 Eng. Hussein Ghalib</div>
                <div class="copyright">إعداد | حسين غالب المدهش  |  إشراف | د/فهد القاسم</div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
